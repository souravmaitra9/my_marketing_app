{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "leaflet.fullname" . }}
  labels:
    {{- include "leaflet.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "leaflet.secretName" . }}
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: redis_url
    - secretKey: LLM_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
        property: llm_api_key
{{- end }}
