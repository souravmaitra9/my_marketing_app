name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
      - name: Pytest
        run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t leaflet-api:${{ github.sha }} backend
          docker build -t leaflet-web:${{ github.sha }} frontend
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.58.1/contrib/install.sh | sh -s -- -b "$HOME/bin" v0.58.1
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Scan images
        run: |
          # Report only. Base-image advisories move on their own, and this
          # workflow has no registry credentials to refresh pinned digests.
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 0 --no-progress leaflet-api:${{ github.sha }}
          trivy image --severity CRITICAL --ignore-unfixed --exit-code 0 --no-progress leaflet-web:${{ github.sha }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint deploy/helm/leaflet
